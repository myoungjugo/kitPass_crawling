<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kitPass · 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body class="login-body">
  <form class="login-card" method="post">
    <div class="board__mark">kitPass</div>
    <p class="login-card__hint">관리자 비밀번호를 입력하세요</p>
    <input type="password" name="password" placeholder="비밀번호" autofocus required>
    {% if error %}<p class="login-card__error">{{ error }}</p>{% endif %}
    <button type="submit">입장</button>
  </form>
</body>
</html>
